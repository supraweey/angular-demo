@if (isAddingTask) {
    <app-new-task [newTask]="newTask" (cancel)="onCancelTask()" (add)="onAddTask($event)"></app-new-task>
}
<section id="tasks">
    <header>
        <h2>{{ name }}'s Tasks</h2>
        <menu>
            <button (click)="onStartAddTask()">Add Tasks</button>
        </menu>
    </header>

    <ul>
        @for (task of selectedUserTask; track task.id) {
        <li>
            <app-task [task]="task" (complete)="onCompleteTask($event)"></app-task>
        </li>   
        }
       
    </ul>
    
</section>
